# Webhook satellite CI gates for eshu-webhook.
#
# Thin caller over the shared lane bodies in
# eshu-hq/.github/.github/workflows/go-collector-ci.yml (v2, pinned below).
# This file holds the paths-filter `changes` job, the `lanes` call with this
# repo's run-gate wiring, two caller-side jobs the reusable cannot own
# (weekly findings issue, SARIF upload), and the required `ci-complete`
# aggregator. Only `ci-complete` is ever required in a ruleset.
#
# Effective lane set inside `lanes`: lint, test, race, shell, image,
# boundary, govulncheck, gosec, actionlint. Each run-* input below is the
# exact expression the retired inline lane used as its `if:` (schedule runs
# still gate to govulncheck + gosec only).
#
# The reusable is pinned to the v2 merge commit, never the tag. The inline
# lanes waited on v1 gaps (no govulncheck/gosec path gates, symbol-mode
# govulncheck that panics on Go 1.26 SSA, a gosec type-error exit, no
# actionlint lane); v2 closes them, so the swap is thin.
#
# Accepted deltas of the move (documented, not silent):
# - Check-run names nest under the call (`lanes / lint`, `lanes / race`, ...).
#   ci-complete is a caller job and keeps its bare name, so the ruleset's
#   required context does not change.
# - The boundary tests (import boundary, 1 MiB cap, wire limits) were a step
#   inside `test`; they now run as the reusable `boundary` lane via
#   boundary-command, gated like `test`. `test` still runs go test ./....
# - gosec: the reusable scan never fails by itself. gosec-fail-on-findings is
#   true on every event so PR and push runs stay blocking on any finding, as
#   the inline lane was (baseline: 0 findings, 2 per-site #nosec with
#   reasons). Scheduled runs now also fail on findings; inline they were
#   summary-only. The reusable runs the fail step before the artifact upload,
#   so a run that fails on findings carries no gosec artifact; the count is
#   in the step summary. Upstream follow-up: upload before failing.
# - Security-tab SARIF upload moved to the gosec-sarif caller job (same
#   non-PR condition, continue-on-error). It reads the lane artifact, so it
#   skips when `lanes` fails.
# - Weekly issue filing is one combined `[ci] weekly scan findings` issue
#   from scheduled-findings, replacing the per-scan `[govulncheck]` and
#   `[gosec]` issues (the caller only sees the combined lanes result).
# - lint installs golangci-lint with go install at the pinned version instead
#   of golangci-lint-action v9.3.0: no action-side cache, and the explicit
#   --timeout 10m flag is gone (the 15-minute job timeout bounds the lane).
# - The 500-line cap scans every .go file under the checkout with find
#   (vendor excluded) instead of git ls-files; same set in a fresh checkout.
# - race uploads the profile as `coverage-webhook` (inline: `coverage`) and
#   writes the last 30 lines of the cover table to the summary (inline: the
#   whole table); the floor literal moves to coverage-floor, pinned equal to
#   the Makefile by TestCoverageFloorParity.
# - shell runs ludeeus/action-shellcheck 2.0.0 (00cae500...) as pinned in the
#   reusable, replacing the inline master-branch SHA 00b27aa7....
# - actionlint runs from the sha256-checked tarball (v1.7.12) instead of the
#   rhysd/actionlint action; same version.
# - setup-go gets cache-dependency-path ./go.sum from the reusable. This
#   module has no go.sum, so the cache restore logs a warning (setup-go
#   catches it, v7.0.0 src/main.ts) and the lane continues uncached.
# - workflow_dispatch is not added; the trigger set is unchanged.
#
# Pinned actions (SHAs re-resolved 2026-11-01 via git ls-remote; Dependabot
# github-actions proposes bumps, weekly grouped):
#   actions/checkout v7.0.1              3d3c42e5aac5ba805825da76410c181273ba90b1
#   dorny/paths-filter v4                ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
#   actions/download-artifact v7         37930b1c2abaa49bbe596cd826c3c89aef350131
#   github/codeql-action/upload-sarif v4.39.1 9b3254085494b55a0f7c4c2b3d2d52cc712ce370
#   eshu-hq/.github v2                   4d01ab90baf5dd77c21cc1ee6bdf701332613449
# Go tools (passed as inputs; hash-verified by the toolchain on install):
#   golangci-lint v2.12.2 (config in .golangci.yml)
#   govulncheck v1.9.0, run with -scan package (Go 1.26 SSA-safe)
#   gosec v2.30.0 (newer than the reusable default v2.27.1)
#   actionlint 1.7.12 (tarball, sha256-checked upstream)

name: webhook-ci

on:
  pull_request:
  push:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC: govulncheck + gosec only

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Runs on every event on purpose: on push the filter outputs are unused
    # (lane conditions short-circuit on event), but every lane `needs` this
    # job — skipping it on push drags all lanes to skipped and the push run
    # goes vacantly green (observed on the post-merge main run).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      image: ${{ steps.filter.outputs.image }}
      workflows: ${{ steps.filter.outputs.workflows }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # Needed so the `misc` catch-all below can use `!` negations;
          # groups without negations behave exactly as before.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            fixtures:
              # The satellite ships no fixtures: testdata/** exists only so
              # the filter group stays stable with the org contract.
              - 'testdata/**'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
            image:
              - 'Dockerfile'
              - '.dockerignore'
            workflows:
              - '.github/workflows/**'
            misc:
              # Anything not classified above runs the full Go lanes.
              # Docs-only must keep skipping, so the docs skip set stays
              # negated here; every classified pattern is negated too so
              # narrow lanes (fixtures/shell/image) keep their shape.
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!**/*.go'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!testdata/**'
              - '!**/*.sh'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!.github/workflows/**'

  lanes:
    needs: [changes]
    # No timeout-minutes: the schema forbids it on reusable-call jobs. Each
    # inner lane carries its own timeout, which bounds this job.
    uses: eshu-hq/.github/.github/workflows/go-collector-ci.yml@4d01ab90baf5dd77c21cc1ee6bdf701332613449 # v2
    with:
      module: webhook
      go-version-file: go.mod
      coverage-floor: 90.0
      # Pin every tool the retired lanes pinned. Reusable defaults float
      # across tags, and this move must neither downgrade nor silently
      # upgrade a scanner.
      golangci-lint-version: v2.12.2
      govulncheck-version: v1.9.0
      gosec-version: v2.30.0
      actionlint-version: 1.7.12
      actionlint-sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run-lint: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true')) }}
      run-test: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true')) }}
      run-race: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true')) }}
      run-shell: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.shell == 'true') }}
      run-image: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (needs.changes.outputs.image == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true')) }}
      image-tag: ci-webhook:ci
      image-context: .
      # The build is never pushed. This proves every Dockerfile base is
      # digest-pinned (no floating tags) so the image build is reproducible.
      image-command: |
        set -euo pipefail
        from_total=$(grep -Ec '^[[:space:]]*FROM ' Dockerfile)
        from_pinned=$(grep -Ec '^[[:space:]]*FROM [^[:space:]]+@sha256:[0-9a-f]{64}' Dockerfile)
        echo "Dockerfile bases: $from_pinned/$from_total digest-pinned"
        [ "$from_total" -ge 1 ] && [ "$from_pinned" -eq "$from_total" ]
      # The boundary tests ran as a `test` step; they keep the `test` gate.
      run-boundary: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true')) }}
      boundary-command: go test . -run 'TestImportBoundary|TestBodyOverLimit|TestDefaultBodyLimit|TestWireFieldLimit|TestEmptyPayload|TestMalformedJSON' -count=1 -v
      run-govulncheck: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && (needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflows == 'true')) }}
      run-gosec: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true')) }}
      # Blocking on PR, push, and schedule, as the inline gosec lane was on
      # PR and push. Triage in the open with per-site #nosec reasons, never
      # blanket-exclude.
      gosec-fail-on-findings: true
      run-actionlint: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && needs.changes.outputs.workflows == 'true') }}

  scheduled-findings:
    # The reusable runs contents:read-only, so weekly issue filing stays a
    # caller job. One combined govulncheck+gosec issue (the caller cannot see
    # per-lane results): fires only when lanes failed on a schedule event,
    # and lists-or-comments instead of duplicating.
    needs: [lanes]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: file or update the weekly findings issue
        run: |
          title="[ci] weekly scan findings $(date -u +%F)"
          body="Scheduled govulncheck/gosec failed on ${{ github.sha }}. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          open=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  gosec-sarif:
    # Security-tab upload the reusable deliberately omits (fork PRs run
    # read-only): caller-side, non-PR events only, and continue-on-error
    # so a 403 never turns into a silent green no-op. Skips when lanes
    # failed: a gosec failure leaves no artifact (the reusable fails before
    # it uploads), and the count stays in that run's summary.
    needs: [lanes]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: gosec-webhook
          path: ${{ github.workspace }}
      - name: upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gosec.sarif
        continue-on-error: true

  ci-complete:
    needs: [changes, lanes, scheduled-findings, gosec-sarif]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: aggregate (pass when needed lanes passed or legitimately skipped)
        run: |
          python3 - <<'EOF'
          import json, os
          # NEEDS_JSON is toJSON(needs): {job: {"result": ..., "outputs": ...}}.
          # Compare v["result"]: comparing whole job OBJECTS never matches
          # (false-green), and needs.*.result is a bare ARRAY that kills
          # green runs. Never change this shape without a seeded red proof.
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v.get("result") for k, v in needs.items()
                 if isinstance(v, dict) and v.get("result") in ("failure", "cancelled")}
          if bad:
              print("FAIL:", bad)
              raise SystemExit(1)
          print("ci-complete: pass (skips allowed)")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
